name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: Backend — pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: expense_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/expense_tracker_test
      JWT_SECRET_KEY: ci-only-secret-not-used-in-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -e .

      - name: Create test database
        # The postgres service may already have created it via POSTGRES_DB;
        # only create when missing so the step is idempotent.
        run: |
          if ! PGPASSWORD=postgres psql -h localhost -U postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'expense_tracker_test'" | grep -q 1; then
            PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE expense_tracker_test;"
          fi

      - name: Run migrations against the test database
        working-directory: backend
        env:
          # Alembic resolves the URL from settings.DATABASE_URL, which defaults
          # to the local dev database; CI must migrate the test database.
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/expense_tracker_test
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v

  frontend-checks:
    name: Frontend — lint, typecheck, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Production build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

  docker-builds:
    name: Docker — build images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
